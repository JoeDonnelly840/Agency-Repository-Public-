<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RegHunter logo">
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e35"/>
      <stop offset="0.45" stop-color="#101216"/>
      <stop offset="1" stop-color="#040506"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfc7b2"/>
      <stop offset="0.5" stop-color="#f4efe2"/>
      <stop offset="1" stop-color="#bdb49c"/>
    </linearGradient>
  </defs>
  <!-- lacquered tile -->
  <rect width="64" height="64" rx="14" fill="url(#lacquer)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <path d="M3 15 Q3 3 15 3 H44 Q20 12 3 36 Z" fill="url(#sheen)"/>
  <!-- reticle -->
  <circle cx="32" cy="33" r="21" fill="none" stroke="#6fb3a6" stroke-width="2.2"/>
  <g stroke="#6fb3a6" stroke-width="2.2" stroke-linecap="round">
    <line x1="32" y1="7" x2="32" y2="13"/><line x1="32" y1="53" x2="32" y2="59"/>
    <line x1="6" y1="33" x2="12" y2="33"/><line x1="52" y1="33" x2="58" y2="33"/>
  </g>
  <!-- column: capital, fluted shaft, base -->
  <g fill="url(#ivory)">
    <rect x="21" y="19" width="22" height="3" rx="0.8"/>
    <circle cx="22.6" cy="24" r="2.4"/><circle cx="41.4" cy="24" r="2.4"/>
    <rect x="22.6" y="21.6" width="18.8" height="3.2"/>
    <rect x="25" y="24.8" width="14" height="17.4"/>
    <rect x="23" y="42.2" width="18" height="2.6" rx="0.6"/>
    <rect x="20.5" y="44.8" width="23" height="2.8" rx="0.6"/>
  </g>
  <g stroke="#14161a" stroke-opacity="0.55" stroke-width="1">
    <line x1="28.5" y1="26" x2="28.5" y2="41.2"/><line x1="32" y1="26" x2="32" y2="41.2"/><line x1="35.5" y1="26" x2="35.5" y2="41.2"/>
  </g>
  <circle cx="22.6" cy="24" r="0.9" fill="#14161a" fill-opacity="0.6"/><circle cx="41.4" cy="24" r="0.9" fill="#14161a" fill-opacity="0.6"/>
  <!-- laser dot -->
  <circle cx="32" cy="33" r="3.1" fill="#e5483f" fill-opacity="0.25"/>
  <circle cx="32" cy="33" r="1.6" fill="#ff5b4f"/>
</svg>
