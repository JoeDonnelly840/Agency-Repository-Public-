<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RegCollect logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5fd6"/><stop offset="1" stop-color="#13294b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
  <!-- stacked records gathered into a collection -->
  <rect x="14" y="15" width="36" height="7" rx="2" fill="#ffffff" fill-opacity=".38"/>
  <rect x="14" y="26" width="36" height="7" rx="2" fill="#ffffff" fill-opacity=".62"/>
  <rect x="14" y="37" width="36" height="7" rx="2" fill="#ffffff"/>
  <!-- one record marked as found -->
  <rect x="14" y="48" width="22" height="3" rx="1.5" fill="#8db2ff"/>
  <circle cx="44" cy="40.5" r="2" fill="#13294b"/>
</svg>
